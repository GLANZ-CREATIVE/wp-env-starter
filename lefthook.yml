pre-commit:
  parallel: true
  commands:
    format:
      glob: "theme/**/*.{css,js,ts,php}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    stylelint:
      glob: "theme/src/**/*.css"
      run: pnpm exec stylelint --fix {staged_files}
      stage_fixed: true
    eslint:
      glob: "theme/src/**/*.{js,ts}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    php-lint:
      glob: "theme/**/*.php"
      run: |
        for f in {staged_files}; do
          php -l "$f" || exit 1
        done
