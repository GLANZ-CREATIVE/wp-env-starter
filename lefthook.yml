pre-commit:
  parallel: true
  commands:
    format:
      glob: "theme/**/*.{css,js,ts,php}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    stylelint:
      glob: "theme/src/**/*.css"
      run: pnpm exec stylelint --fix {staged_files}
      stage_fixed: true
    eslint:
      glob: "theme/src/**/*.{js,ts}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    php-lint:
      run: pnpm php:lint
    php-cs:
      run: pnpm php:cs:staged
